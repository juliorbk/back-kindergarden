spring:
  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.ueclca.backend: INFO

app:
  security:
    jwt:
      issuer: back-kindergarten-test
      secret: test-secret-test-secret-test-secret-1234567890
      expiration-minutes: 30
  seed:
    enabled: false
  media:
    storage-path: ${java.io.tmpdir}/back-kindergarten-test-media
    public-base-url: http://localhost:8080
    max-file-size-bytes: 52428800
  telegram:
    enabled: false
