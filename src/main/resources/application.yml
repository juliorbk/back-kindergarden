spring:
  application:
    name: back-kindergarten
  profiles:
    default: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/kindergarten}
    username: ${DATABASE_USER:kindergarten}
    password: ${DATABASE_PASSWORD:kindergarten}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 50

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    jwt:
      issuer: ${JWT_ISSUER:back-kindergarten-api}
      secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef0123456789abcdef}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  seed:
    enabled: false
