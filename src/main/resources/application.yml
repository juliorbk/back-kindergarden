spring:
  application:
    name: back-kindergarten
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/kindergarten}
    username: ${DATABASE_USER:kindergarten}
    password: ${DATABASE_PASSWORD:kindergarten}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 55MB
      max-request-size: 60MB
  data:
    web:
      pageable:
        max-page-size: 50

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    jwt:
      issuer: ${JWT_ISSUER:back-kindergarten-api}
      secret: ${JWT_SECRET:}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  seed:
    enabled: false
  media:
    storage-path: ${MEDIA_STORAGE_PATH:./uploads}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:8080}
    max-file-size-bytes: ${MEDIA_MAX_FILE_SIZE_BYTES:52428800}
